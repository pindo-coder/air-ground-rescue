#VRML_SIM R2025a utf8
# Primitive-only, local, camera-only differential-drive research platform.
PROTO VisionRover [
  field SFVec3f translation 0 0 0.002
  field SFRotation rotation 0 0 1 0
  field SFString name "Rescue Rover"
  field SFString controller "vision_agent"
  field SFString customData ""
  field SFInt32 cameraWidth 640
  field SFInt32 cameraHeight 480
  field SFFloat cameraFieldOfView 1.5707963268
  field SFVec3f leftCameraTranslation 0.26 0.07 0.30
  field SFVec3f rightCameraTranslation 0.26 -0.07 0.30
  field SFRotation cameraRotation 0 1 0 0.08
  field SFFloat cameraNoise 0.003
] {
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    customData IS customData
    contactMaterial "caster"
    window "<none>"
    children [
      Pose {
        translation 0 0 0.155
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.035 0.19 0.24 roughness 0.7 metalness 0.15 }
            geometry Box { size 0.49 0.33 0.13 }
          }
        ]
      }
      Pose {
        translation -0.035 0 0.232
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.04 0.65 0.72 roughness 0.6 metalness 0 }
            geometry Box { size 0.28 0.30 0.025 }
          }
        ]
      }
      Pose {
        translation -0.10 0 0.27
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.04 0.10 0.14 roughness 0.7 metalness 0 }
            geometry Cylinder { radius 0.045 height 0.075 subdivision 16 }
          }
        ]
      }
      Pose {
        translation -0.10 0 0.315
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.05 0.85 0.95 emissiveColor 0.025 0.25 0.3 roughness 0.4 metalness 0 }
            geometry Sphere { radius 0.035 subdivision 2 }
          }
        ]
      }
      Pose {
        translation 0.22 0 0.27
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.1 0.12 0.14 roughness 0.8 metalness 0 }
            geometry Box { size 0.06 0.24 0.06 }
          }
        ]
      }
      Camera {
        translation IS leftCameraTranslation
        rotation IS cameraRotation
        name "camera_left"
        noise IS cameraNoise
        fieldOfView IS cameraFieldOfView
        width IS cameraWidth
        height IS cameraHeight
        near 0.025
        far 80
      }
      Camera {
        translation IS rightCameraTranslation
        rotation IS cameraRotation
        name "camera_right"
        noise IS cameraNoise
        fieldOfView IS cameraFieldOfView
        width IS cameraWidth
        height IS cameraHeight
        near 0.025
        far 80
      }
      HingeJoint {
        jointParameters HingeJointParameters { axis 0 1 0 anchor 0 0.205 0.09 dampingConstant 0.01 }
        device [ RotationalMotor { name "left_motor" maxVelocity 10 maxTorque 5 sound "" } ]
        endPoint Solid {
          translation 0 0.205 0.09
          rotation 1 0 0 1.5707963268
          children [
            Shape {
              appearance PBRAppearance { baseColor 0.045 0.05 0.06 roughness 1 metalness 0 }
              geometry Cylinder { radius 0.09 height 0.055 subdivision 24 }
            }
            Pose {
              translation 0 0 -0.030
              children [ Shape { appearance PBRAppearance { baseColor 0.22 0.29 0.32 roughness 0.5 metalness 0.2 } geometry Cylinder { radius 0.042 height 0.008 subdivision 12 } } ]
            }
          ]
          name "left wheel"
          contactMaterial "rubber"
          boundingObject Cylinder { radius 0.09 height 0.055 }
          physics Physics { density -1 mass 0.25 }
        }
      }
      HingeJoint {
        jointParameters HingeJointParameters { axis 0 1 0 anchor 0 -0.205 0.09 dampingConstant 0.01 }
        device [ RotationalMotor { name "right_motor" maxVelocity 10 maxTorque 5 sound "" } ]
        endPoint Solid {
          translation 0 -0.205 0.09
          rotation 1 0 0 1.5707963268
          children [
            Shape {
              appearance PBRAppearance { baseColor 0.045 0.05 0.06 roughness 1 metalness 0 }
              geometry Cylinder { radius 0.09 height 0.055 subdivision 24 }
            }
            Pose {
              translation 0 0 0.030
              children [ Shape { appearance PBRAppearance { baseColor 0.22 0.29 0.32 roughness 0.5 metalness 0.2 } geometry Cylinder { radius 0.042 height 0.008 subdivision 12 } } ]
            }
          ]
          name "right wheel"
          contactMaterial "rubber"
          boundingObject Cylinder { radius 0.09 height 0.055 }
          physics Physics { density -1 mass 0.25 }
        }
      }
      Pose {
        translation 0.19 0 0.04
        children [ Shape { appearance PBRAppearance { baseColor 0.18 0.23 0.26 roughness 0.7 metalness 0.1 } geometry Sphere { radius 0.04 subdivision 2 } } ]
      }
      Pose {
        translation -0.19 0 0.04
        children [ Shape { appearance PBRAppearance { baseColor 0.18 0.23 0.26 roughness 0.7 metalness 0.1 } geometry Sphere { radius 0.04 subdivision 2 } } ]
      }
    ]
    boundingObject Group {
      children [
        Pose { translation 0 0 0.155 children [ Box { size 0.49 0.33 0.13 } ] }
        Pose { translation 0.19 0 0.04 children [ Sphere { radius 0.04 } ] }
        Pose { translation -0.19 0 0.04 children [ Sphere { radius 0.04 } ] }
      ]
    }
    physics Physics { density -1 mass 5 centerOfMass [ 0 0 0.12 ] }
  }
}
