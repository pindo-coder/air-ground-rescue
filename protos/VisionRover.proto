#VRML_SIM R2025a utf8
# Local, camera-only four-wheel skid-steer research platform.
EXTERNPROTO "RescueRoverBody.proto"
EXTERNPROTO "RescueRoverWheel.proto"

PROTO VisionRover [
  field SFVec3f translation 0 0 0.002
  field SFRotation rotation 0 0 1 0
  field SFString name "Rescue Rover"
  field SFString controller "vision_agent"
  field SFString customData ""
  field SFInt32 cameraWidth 640
  field SFInt32 cameraHeight 480
  field SFFloat cameraFieldOfView 1.5707963268
  field SFVec3f leftCameraTranslation 0.26 0.07 0.30
  field SFVec3f rightCameraTranslation 0.26 -0.07 0.30
  field SFRotation cameraRotation 0 1 0 0.08
  field SFFloat cameraNoise 0.003
] {
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    customData IS customData
    window "<none>"
    children [
      RescueRoverBody { stereoOnly TRUE }
      Camera {
        translation IS leftCameraTranslation
        rotation IS cameraRotation
        name "camera_left"
        noise IS cameraNoise
        fieldOfView IS cameraFieldOfView
        width IS cameraWidth
        height IS cameraHeight
        near 0.025
        far 80
      }
      Camera {
        translation IS rightCameraTranslation
        rotation IS cameraRotation
        name "camera_right"
        noise IS cameraNoise
        fieldOfView IS cameraFieldOfView
        width IS cameraWidth
        height IS cameraHeight
        near 0.025
        far 80
      }
      DEF FRONT_LEFT RescueRoverWheel {
        anchor .150 .205 .09
        name "front left wheel"
        motorName "left_motor::front"
      }
      DEF FRONT_RIGHT RescueRoverWheel {
        anchor .150 -.205 .09
        name "front right wheel"
        motorName "right_motor::front"
      }
      DEF REAR_LEFT RescueRoverWheel {
        anchor -.150 .205 .09
        name "rear left wheel"
        motorName "left_motor::rear"
      }
      DEF REAR_RIGHT RescueRoverWheel {
        anchor -.150 -.205 .09
        name "rear right wheel"
        motorName "right_motor::rear"
      }
    ]
    boundingObject Pose {
      translation 0 0 .155
      children [ Box { size .49 .33 .13 } ]
    }
    physics Physics { density -1 mass 5 centerOfMass [ 0 0 0.12 ] }
  }
}
