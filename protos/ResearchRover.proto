              translation 0 0 0.030
              children [ Shape { appearance PBRAppearance { baseColor 0.22 0.29 0.32 roughness 0.5 metalness 0.2 } geometry Cylinder { radius 0.042 height 0.008 subdivision 12 } } ]
            }
          ]
          name "right wheel"
          contactMaterial "rubber"
          boundingObject Cylinder { radius 0.09 height 0.055 }
          physics Physics { density -1 mass 0.25 }
        }
      }
      Pose {
        translation 0.19 0 0.04
        children [ Shape { appearance PBRAppearance { baseColor 0.18 0.23 0.26 roughness 0.7 metalness 0.1 } geometry Sphere { radius 0.04 subdivision 2 } } ]
      }
      Pose {
        translation -0.19 0 0.04
        children [ Shape { appearance PBRAppearance { baseColor 0.18 0.23 0.26 roughness 0.7 metalness 0.1 } geometry Sphere { radius 0.04 subdivision 2 } } ]
