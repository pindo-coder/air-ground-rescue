#VRML_SIM R2025a utf8
# LiDAR/RGB-D four-wheel skid-steer research platform; provisional configuration.
EXTERNPROTO "RescueRoverBody.proto"
EXTERNPROTO "RescueRoverWheel.proto"

PROTO ResearchRover [
  field SFVec3f translation 0 0 0.002
  field SFRotation rotation 0 0 1 0
  field SFString name "Rescue Rover"
  field SFString controller "search_agent"
  field SFString customData ""
] {
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    customData IS customData
    window "<none>"
    children [
      RescueRoverBody { }
      Camera {
        translation 0.26 0 0.30
        rotation 0 1 0 0.08
        name "rgb"
        width 320
        height 240
        fieldOfView 1.5707963268
        noise 0.003
        near .05
        far 12
      }
      RangeFinder {
        translation 0.26 0 0.30
        rotation 0 1 0 0.08
        name "depth"
        width 320
        height 240
        fieldOfView 1.5707963268
        minRange .2
        maxRange 12
        noise .002
      }
      Lidar {
        translation 0 0 .37
        name "lidar"
        horizontalResolution 360
        fieldOfView 6.28318530718
        verticalFieldOfView .15
        numberOfLayers 3
        minRange .15
        maxRange 8
        noise .001
      }
      InertialUnit { name "attitude" noise .003 }
      GPS { name "deployment_gps" accuracy .04 noiseCorrelation .2 }
      Receiver { name "aerial_receiver" channel 17 bufferSize 65536 }
      DEF FRONT_LEFT RescueRoverWheel {
        anchor .150 .205 .09
        name "front left wheel"
        motorName "left_motor::front"
        encoderName "left_encoder"
      }
      DEF FRONT_RIGHT RescueRoverWheel {
        anchor .150 -.205 .09
        name "front right wheel"
        motorName "right_motor::front"
        encoderName "right_encoder"
      }
      DEF REAR_LEFT RescueRoverWheel {
        anchor -.150 .205 .09
        name "rear left wheel"
        motorName "left_motor::rear"
      }
      DEF REAR_RIGHT RescueRoverWheel {
        anchor -.150 -.205 .09
        name "rear right wheel"
        motorName "right_motor::rear"
      }
    ]
    boundingObject Pose {
      translation 0 0 .155
      children [ Box { size .49 .33 .13 } ]
    }
    physics Physics { density -1 mass 5 centerOfMass [ 0 0 0.12 ] }
  }
}
