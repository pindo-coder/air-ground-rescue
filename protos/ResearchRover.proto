#VRML_SIM R2025a utf8
# LiDAR/RGB-D four-wheel skid-steer research platform; provisional configuration.
EXTERNPROTO "RescueRoverBody.proto"
EXTERNPROTO "RescueRoverWheel.proto"

PROTO ResearchRover [
  field SFVec3f translation 0 0 0.002
  field SFRotation rotation 0 0 1 0
  field SFString name "Rescue Rover"
  field SFString controller "search_agent"
  field SFString customData ""
  field SFVec3f cargo1Scale 1 1 1
  field SFVec3f cargo2Scale 1 1 1
] {
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    customData IS customData
    window "<none>"
    children [
      RescueRoverBody { }
      # Modular twin-bay servo supply release rack on rear deck (strictly z <= 0.344 m, zero LiDAR/RGB-D occlusion)
      Pose {
        translation -0.112 0 0.307
        children [
          # Base rail plate + center divider + rear release servo bar
          Pose {
            translation 0 0 0.003
            children [
              Shape {
                appearance PBRAppearance { baseColor 0.14 0.16 0.19 roughness 0.45 metalness 0.72 }
                geometry Box { size 0.142 0.184 0.006 }
              }
            ]
          }
          Pose {
            translation 0 0 0.015
            children [
              Shape {
                appearance PBRAppearance { baseColor 0.20 0.23 0.27 roughness 0.40 metalness 0.75 }
                geometry Box { size 0.136 0.008 0.020 }
              }
            ]
          }
          Pose {
            translation 0 0.090 0.014
            children [
              Shape {
                appearance PBRAppearance { baseColor 0.20 0.23 0.27 roughness 0.40 metalness 0.75 }
                geometry Box { size 0.136 0.006 0.018 }
              }
            ]
          }
          Pose {
            translation 0 -0.090 0.014
            children [
              Shape {
                appearance PBRAppearance { baseColor 0.20 0.23 0.27 roughness 0.40 metalness 0.75 }
                geometry Box { size 0.136 0.006 0.018 }
              }
            ]
          }
          # Supply Crate 1 (left bay) - scaled down upon physical delivery #1
          Transform {
            translation 0 0.046 0.020
            scale IS cargo1Scale
            children [
              Shape {
                appearance PBRAppearance { baseColor 0.96 0.44 0.06 roughness 0.38 metalness 0.08 }
                geometry Box { size 0.122 0.076 0.032 }
              }
              Pose {
                translation 0 0 0.0165
                children [
                  Shape {
                    appearance PBRAppearance { baseColor 0.96 0.97 0.99 roughness 0.30 metalness 0.0 }
                    geometry Box { size 0.044 0.012 0.002 }
                  }
                  Shape {
                    appearance PBRAppearance { baseColor 0.96 0.97 0.99 roughness 0.30 metalness 0.0 }
                    geometry Box { size 0.012 0.044 0.002 }
                  }
                ]
              }
            ]
          }
          # Supply Crate 2 (right bay) - scaled down upon physical delivery #2
          Transform {
            translation 0 -0.046 0.020
            scale IS cargo2Scale
            children [
              Shape {
                appearance PBRAppearance { baseColor 0.96 0.44 0.06 roughness 0.38 metalness 0.08 }
                geometry Box { size 0.122 0.076 0.032 }
              }
              Pose {
                translation 0 0 0.0165
                children [
                  Shape {
                    appearance PBRAppearance { baseColor 0.96 0.97 0.99 roughness 0.30 metalness 0.0 }
                    geometry Box { size 0.044 0.012 0.002 }
                  }
                  Shape {
                    appearance PBRAppearance { baseColor 0.96 0.97 0.99 roughness 0.30 metalness 0.0 }
                    geometry Box { size 0.012 0.044 0.002 }
                  }
                ]
              }
            ]
          }
        ]
      }
      Camera {
        translation 0.26 0 0.30
        rotation 0 1 0 0.08
        name "rgb"
        width 320
        height 240
        fieldOfView 1.5707963268
        noise 0.003
        near .05
        far 12
      }
      Camera {
        translation -1.35 0 0.92
        rotation 0 1 0 0.42
        name "rover_chase_cam"
        width 480
        height 270
        fieldOfView 1.15
        near .1
        far 60
      }
      RangeFinder {
        translation 0.26 0 0.30
        rotation 0 1 0 0.08
        name "depth"
        width 320
        height 240
        fieldOfView 1.5707963268
        minRange .2
        maxRange 12
        noise .002
      }
      Lidar {
        translation 0 0 .37
        name "lidar"
        horizontalResolution 360
        fieldOfView 6.28318530718
        verticalFieldOfView .15
        numberOfLayers 3
        minRange .15
        maxRange 8
        noise .001
      }
      InertialUnit { name "attitude" noise .003 }
      GPS { name "deployment_gps" accuracy .04 noiseCorrelation .2 }
      Receiver { name "aerial_receiver" channel 17 bufferSize 65536 }
      DEF FRONT_LEFT RescueRoverWheel {
        anchor .150 .205 .09
        name "front left wheel"
        motorName "left_motor::front"
        encoderName "left_encoder"
      }
      DEF FRONT_RIGHT RescueRoverWheel {
        anchor .150 -.205 .09
        name "front right wheel"
        motorName "right_motor::front"
        encoderName "right_encoder"
      }
      DEF REAR_LEFT RescueRoverWheel {
        anchor -.150 .205 .09
        name "rear left wheel"
        motorName "left_motor::rear"
      }
      DEF REAR_RIGHT RescueRoverWheel {
        anchor -.150 -.205 .09
        name "rear right wheel"
        motorName "right_motor::rear"
      }
    ]
    boundingObject Pose {
      translation 0 0 .155
      children [ Box { size .49 .33 .13 } ]
    }
    physics Physics { density -1 mass 5 centerOfMass [ 0 0 0.12 ] }
  }
}
