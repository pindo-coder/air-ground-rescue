name: Dual-Platform Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unittest-and-gazebo-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-search.txt
            requirements-search-yolo.txt
            requirements-local-learning.txt

      - name: Install OpenCV system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.6,<3" torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-search.txt -r requirements-search-yolo.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Fetch pinned upstream YOLO weights
        run: python tools/fetch_search_model.py

      - name: Run full Webots + Gazebo unit test suite
        run: python -m unittest discover -s tests -v

      - name: Smoke-test D scene generation and Gazebo SDF export
        run: |
          python tools/build_search_worlds.py --case D
          python tools/export_gazebo_d.py --output /tmp/gz_d_ci
          test -s /tmp/gz_d_ci/search_d.sdf
          test -s /tmp/gz_d_ci/environment.json
